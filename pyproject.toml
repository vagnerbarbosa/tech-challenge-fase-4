[tool.poetry]
name = "multimodal-health-analysis"
version = "1.0.0"
description = "Tech Challenge Fase 4 - Sistema multimodal de análise de saúde da mulher usando Azure AI Services"
authors = [
    "Vagner Barbosa <vagnerbarbosasantos@gmail.com>",
    "Leticia Nepomucena <leticianepomucena@gmail.com>",
    "Marcelo Pucciarelli <marcelo.pucciarelli@gmail.com>",
    "Anderson Leite <anderson.leite@gmail.com>",
]
readme = "README.md"
license = "MIT"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# FastAPI e servidor
fastapi = ">=0.104.0"
uvicorn = {extras = ["standard"], version = ">=0.24.0"}
python-multipart = ">=0.0.6"

# Azure AI Services
azure-ai-textanalytics = ">=5.4.0"
azure-cognitiveservices-speech = ">=1.48.0"
azure-ai-vision-imageanalysis = ">=1.0.0"
azure-storage-blob = ">=12.0.0"
azure-identity = ">=1.15.0"

# Processamento de mídia
opencv-python = ">=4.8.0"
numpy = ">=1.24.0"
pillow = ">=10.0.0"

# Banco de dados
sqlalchemy = {extras = ["asyncio"], version = ">=2.0.0"}
aiosqlite = ">=0.19.0"

# Configuração e utilidades
pydantic = ">=2.5.0"
pydantic-settings = ">=2.1.0"
python-dotenv = ">=1.0.0"
httpx = ">=0.25.0"

# Logging estruturado
structlog = ">=23.2.0"

# Rate limiting
slowapi = ">=0.1.0"
redis = {extras = ["asyncio"], version = ">=5.0.0", optional = true}

[tool.poetry.group.dev.dependencies]
# Testes
pytest = ">=7.4.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=4.1.0"
pytest-mock = ">=3.12.0"
httpx = ">=0.25.0"
respx = ">=0.20.0"

# Qualidade de código
ruff = ">=0.1.0"
mypy = ">=1.7.0"
pre-commit = ">=3.5.0"

# Load testing
locust = ">=2.18.0"

# Documentação
mkdocs = ">=1.5.0"
mkdocs-material = ">=9.4.0"

[tool.poetry.extras]
redis = ["redis"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
ignore_missing_imports = true
show_column_numbers = true
show_error_codes = true
show_error_context = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=70",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "azure: Tests requiring Azure credentials",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/venv/*",
    "*/env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
