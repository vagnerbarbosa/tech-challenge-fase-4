# ===========================================
# Docker Compose com Mocks Azure
# ===========================================
# Uso: docker-compose -f docker-compose.mock.yml up
#
# Este arquivo sobe a API com mocks dos serviços Azure,
# permitindo desenvolvimento local sem conta Azure.

services:
  # -------------------------------------------
  # Mock Server - Simula Azure AI Services
  # -------------------------------------------
  mock-azure:
    build:
      context: ./mock/azure
      dockerfile: Dockerfile
    container_name: mock-azure
    ports:
      - "3001:3001"  # Text Analytics
      - "3002:3002"  # Speech Services
      - "3003:3003"  # Vision
      - "3004:3004"  # Content Safety
    environment:
      - PORT_TEXT=3001
      - PORT_SPEECH=3002
      - PORT_VISION=3003
      - PORT_CONTENT_SAFETY=3004
      - LOG_LEVEL=debug
    volumes:
      - ./mock/azure:/app
    networks:
      - health-network

  # -------------------------------------------
  # API FastAPI (modo desenvolvimento com mocks)
  # -------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: health-api-mock
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # App
      - APP_NAME=Multimodal Health Analysis API (Mock Mode)
      - APP_VERSION=0.9.0
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      # Azure - Apontando para mocks
      - AZURE_TEXT_KEY=fake-key-for-local-dev
      - AZURE_TEXT_ENDPOINT=http://mock-azure:3001/
      - AZURE_SPEECH_KEY=fake-key-for-local-dev
      - AZURE_SPEECH_REGION=local
      - AZURE_VISION_KEY=fake-key-for-local-dev
      - AZURE_VISION_ENDPOINT=http://mock-azure:3003/
      # Azure AI Content Safety (Multilingual Risk Detection)
      - AZURE_CONTENT_SAFETY_KEY=fake-key-for-local-dev
      - AZURE_CONTENT_SAFETY_ENDPOINT=http://mock-azure:3004/
      - CONTENT_SAFETY_ENABLED=false  # Habilitar quando mock CS estiver pronto
      # Database
      - DATABASE_URL=sqlite+aiosqlite:///./data/health_analysis.db
      # Redis
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=false
      # Rate Limiting (habilitado para testar em dev)
      - RATE_LIMIT_ENABLED=true
      - MAX_TEXT_REQUESTS_PER_DAY=160
      - MAX_SPEECH_MINUTES_PER_DAY=10
      - MAX_VISION_REQUESTS_PER_DAY=160
      # Security (Spec 007)
      - SECRET_KEY=dev-secret-key
      - API_KEY_HEADER=X-API-Key
      # Security Hardening
      - SECURITY_API_KEY=test-api-key
      - SECURITY_ENVIRONMENT=development
      - SECURITY_CORS_ORIGINS=http://localhost:3000,http://localhost:8000
      - SECURITY_RATE_LIMIT_PER_MINUTE=60
      - SECURITY_REDIS_URL=redis://redis:6379/0
      # Audit Logging (LGPD)
      - AUDIT_LOG_PATH=/app/logs/audit.log
      - AUDIT_LOG_RETENTION_DAYS=90
      - AUDIT_LOG_MAX_SIZE_MB=100
      # Multimodal
      - MULTIMODAL_TIMEOUT_SECONDS=60
      # Request Timeout
      - REQUEST_TIMEOUT_SECONDS=300
      - UPLOAD_TIMEOUT_SECONDS=600
      # Upload Size Limits (Middleware) - Azure Free Tier Protection
      # Audio: 10MB max (~5-10 min) to protect 10 min/day Azure quota
      - MAX_AUDIO_SIZE_MB=10
      - MAX_AUDIO_DURATION_SECONDS=300
      # Video: Local processing (YOLOv8), 2 min max for analysis quality
      - MAX_VIDEO_SIZE_MB=50
      - MAX_VIDEO_DURATION_SECONDS=120
      # LGPD Compliance
      - ANONYMIZE_PII=true
      - CONSENT_REQUIRED=true
      - DATA_RETENTION_DAYS=30
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - health-network
    depends_on:
      - mock-azure
      - redis
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  # -------------------------------------------
  # Redis (para cache/rate limiting)
  # -------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: health-redis-mock
    ports:
      - "6379:6379"
    networks:
      - health-network

networks:
  health-network:
    driver: bridge
