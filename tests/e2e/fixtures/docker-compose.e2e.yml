# ===========================================
# Docker Compose para Testes E2E
# Infraestrutura slim (~3GB) sem YOLO/PyTorch
# Spec 011 - Testing Strategy E2E
# ===========================================

version: '3.8'

services:
  # -------------------------------------------
  # API E2E (imagem slim sem YOLO/PyTorch)
  # -------------------------------------------
  api-e2e:
    build:
      context: ../../..
      dockerfile: tests/e2e/Dockerfile.e2e
    container_name: api-e2e
    ports:
      - "9000:8000"
    environment:
      # Azure Speech (mock para E2E)
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY:-mock}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION:-brazilsouth}
      # Azure Language (mock para E2E)
      - AZURE_LANGUAGE_KEY=${AZURE_LANGUAGE_KEY:-mock}
      - AZURE_LANGUAGE_ENDPOINT=${AZURE_LANGUAGE_ENDPOINT:-http://mock-server:3000}
      # Azure Content Safety (mock para E2E)
      - AZURE_CONTENT_SAFETY_KEY=${AZURE_CONTENT_SAFETY_KEY:-mock}
      - AZURE_CONTENT_SAFETY_ENDPOINT=${AZURE_CONTENT_SAFETY_ENDPOINT:-http://mock-server:3000}
      # Security (Spec 007)
      - API_KEY_ADMIN=test-admin-key
      - RATE_LIMIT_ENABLED=false
      # Mock Mode
      - MOCK_MODE=true
      - LOG_LEVEL=INFO
    volumes:
      - ../../../tests/e2e/fixtures/sample_files:/app/fixtures:ro
    depends_on:
      - mock-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -------------------------------------------
  # Mock Server (Wiremock para APIs Azure)
  # -------------------------------------------
  mock-server:
    image: wiremock/wiremock:3.3.1
    container_name: mock-server-e2e
    ports:
      - "3004:8080"
    volumes:
      - ../../../tests/e2e/fixtures/wiremock:/home/wiremock:ro
    command: --verbose

networks:
  default:
    name: e2e-network
