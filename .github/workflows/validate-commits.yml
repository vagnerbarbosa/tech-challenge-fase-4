name: Validar Conventional Commits

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-commits:
    name: Validar Conventional Commits
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional

      - name: Criar configuração do commitlint
        run: |
          cat > commitlint.config.js << 'CONFIG'
          module.exports = {
            extends: ['@commitlint/config-conventional'],
            rules: {
              'type-enum': [2, 'always', [
                'feat', 'fix', 'docs', 'style', 'refactor', 'test', 'chore',
                'ci', 'build', 'perf', 'revert',
                'spec', 'clarify', 'plan', 'research'
              ]],
              'subject-case': [0],
            },
          };
          CONFIG

      - name: Validar commits da PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Validando commits de $BASE_SHA até $HEAD_SHA"

          # Obter lista de commits da PR
          COMMITS=$(git rev-list $BASE_SHA..$HEAD_SHA)

          # Validar cada commit
          EXIT_CODE=0
          for commit in $COMMITS; do
            echo "Validando commit: $commit"
            COMMIT_MSG=$(git log --format=%B -n 1 $commit)
            echo "Mensagem: $COMMIT_MSG"

            if ! echo "$COMMIT_MSG" | npx commitlint --config commitlint.config.js; then
              echo "❌ Commit $commit não segue o padrão Conventional Commits"
              EXIT_CODE=1
            else
              echo "✅ Commit $commit está correto"
            fi
            echo "---"
          done

          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "❌ Alguns commits não seguem o padrão Conventional Commits!"
            echo ""
            echo "📖 Formato esperado:"
            echo "   <tipo>[escopo opcional]: <descrição>"
            echo ""
            echo "   Tipos válidos: feat, fix, docs, style, refactor, test, chore, ci, build, perf, revert"
            echo "   Tipos Specify: spec, clarify, plan, research"
            echo ""
            echo "   Exemplos:"
            echo "   - feat: adiciona nova funcionalidade"
            echo "   - fix: corrige bug na autenticação"
            echo "   - docs: atualiza README"
            echo ""
            echo "📚 Mais informações: https://www.conventionalcommits.org/pt-br/"
            exit 1
          fi

          echo "✅ Todos os commits seguem o padrão Conventional Commits!"

  validate-pr-title:
    name: Validar Título da PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Validar título
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            ci
            build
            perf
            revert
            spec
            clarify
            plan
            research
          requireScope: false
          # Conventional Commits: descrição deve começar com letra minúscula
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            ❌ **Título da PR inválido!**

            O título deve seguir o padrão **Conventional Commits**:

            ```
            <tipo>[escopo opcional]: <descrição>
            ```

            **Tipos válidos:**
            - `feat`: Nova funcionalidade
            - `fix`: Correção de bug
            - `docs`: Documentação
            - `style`: Formatação (sem mudança de código)
            - `refactor`: Refatoração de código
            - `test`: Testes
            - `chore`: Tarefas de build/config
            - `perf`: Melhoria de performance
            - `ci`: Configuração de CI/CD
            - `build`: Sistema de build
            - `revert`: Revertendo alterações
            - `spec`, `clarify`, `plan`, `research`: Tipos do Specify

            **Exemplos válidos:**
            - ✅ `feat(auth): adiciona autenticação JWT`
            - ✅ `fix(api): corrige rate limiting em uploads`
            - ✅ `docs(readme): atualiza instruções de instalação`
            - ✅ `refactor(services): simplifica lógica de cache`
            - ❌ `Feat: Adiciona autenticação` (tipo em maiúscula)
            - ❌ `fix: Corrige bug` (descrição em maiúscula)
            - ❌ `adiciona autenticação` (falta o tipo)

            📚 **Referência:** https://www.conventionalcommits.org/pt-br/v1.0.0/

      - name: Comentar na PR (se inválido)
        if: failure()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: conventional-commit-reminder
          message: |
            ## ⚠️ Atenção: Título da PR não segue Conventional Commits

            Por favor, edite o título da PR para seguir o padrão:

            ```
            <tipo>[escopo opcional]: <descrição em minúscula>
            ```

            **Exemplos:**
            - `feat(api): adiciona endpoint de análise multimodal`
            - `fix(auth): corrige validação de token expirado`
            - `docs(readme): atualiza seção de configuração`
            - `test(unit): adiciona testes para AudioService`

            📚 [Leia mais sobre Conventional Commits](https://www.conventionalcommits.org/pt-br/v1.0.0/)

      - name: Remover comentário (se válido)
        if: success()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: conventional-commit-reminder
          delete: true
