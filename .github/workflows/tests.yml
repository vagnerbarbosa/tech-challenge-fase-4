name: Testes

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Executar Testes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Carregar dependências em cache
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Instalar dependências
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Instalar projeto
        run: poetry install --no-interaction

      - name: Executar linters (Ruff)
        run: |
          poetry run ruff check src/ tests/ || true

      - name: Executar type checker (mypy)
        run: |
          poetry run mypy src/ || true

      - name: Executar testes
        run: |
          poetry run pytest tests/ -v --cov=src --cov-report=xml --cov-report=term --cov-fail-under=70
        env:
          PYTHONPATH: ${{ github.workspace }}
          AZURE_TEXT_KEY: fake-key-for-testing
          AZURE_TEXT_ENDPOINT: http://localhost:3001/

      - name: Validar cobertura mínima (70%)
        run: |
          poetry run python << 'EOF'
          import xml.etree.ElementTree as ET
          import sys
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          coverage = float(root.attrib['line-rate']) * 100
          print(f"📊 Cobertura atual: {coverage:.2f}%")
          print("📊 Cobertura mínima exigida: 70%")
          if coverage < 70:
              print("❌ Cobertura abaixo de 70%. Merge bloqueado.")
              sys.exit(1)
          print("✅ Cobertura acima de 70%!")
          EOF

      - name: Enviar cobertura para Codecov
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  # Job para bloquear merge se os testes falharem
  all-tests-pass:
    name: Todos os Testes Passaram
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Verificar resultados dos testes
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Testes falharam. Merge bloqueado."
            exit 1
          fi
          echo "✅ Todos os testes passaram!"
