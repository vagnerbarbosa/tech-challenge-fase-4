name: E2E Tests

on:
  push:
    branches: [ main, develop, '011-testing-strategy' ]
    paths:
      - 'src/**'
      - 'tests/e2e/**'
      - 'pyproject.toml'
      - 'tests/e2e/Dockerfile.e2e'
      - 'tests/e2e/fixtures/docker-compose.e2e.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/e2e/**'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Instalar Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Instalar dependências
      run: |
        poetry install --no-interaction --no-root
        poetry run pip install pytest requests httpx

    - name: Iniciar ambiente E2E
      run: |
        cd tests/e2e/fixtures
        docker-compose -f docker-compose.e2e.yml up --build -d

        # Aguardar serviços ficarem saudáveis
        echo "Aguardando API ficar pronta..."
        for i in {1..30}; do
          if curl -s http://localhost:9000/health > /dev/null 2>&1; then
            echo "API pronta!"
            break
          fi
          echo "Tentativa $i/30 - aguardando..."
          sleep 5
        done

    - name: Executar testes E2E
      run: |
        poetry run pytest tests/e2e/ -v --tb=short

    - name: Limpeza
      if: always()
      run: |
        cd tests/e2e/fixtures
        docker-compose -f docker-compose.e2e.yml down -v

    - name: Upload de logs em caso de falha
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-logs
        path: |
          /var/log/containers/
          /tmp/e2e-*.log
        retention-days: 5
