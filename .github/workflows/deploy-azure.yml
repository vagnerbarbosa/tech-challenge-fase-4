name: Deploy Azure

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  AZURE_RESOURCE_GROUP: rg-tech-challenge-fase4
  REGISTRY: ghcr.io
  IMAGE_NAME: vagnerbarbosa/tech-challenge-fase4

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-skip:
    name: Verificar se deve pular
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verificar autor do commit
        id: check
        run: |
          AUTHOR=$(git log -1 --pretty=format:'%an')
          MESSAGE=$(git log -1 --pretty=format:'%s')
          echo "Autor: $AUTHOR"
          echo "Mensagem: $MESSAGE"

          # Pular se for commit do bot de deploy ou tiver [skip ci]
          if [[ "$AUTHOR" == "github-actions[bot]" ]] || [[ "$MESSAGE" == *"[skip ci]"* ]]; then
            echo "🚫 Pulando deploy - commit de documentação automática"
            echo "should_skip=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Executando deploy normalmente"
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  check-image:
    name: Verificar Imagem Existente
    needs: [check-skip]
    if: needs.check-skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    outputs:
      needs_build: ${{ steps.check.outputs.needs_build }}
      image_exists: ${{ steps.check.outputs.image_exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar se imagem existe
        id: check
        run: |
          # Calcular hash dos arquivos que afetam o build
          BUILD_HASH=$(echo "${{ hashFiles('Dockerfile', 'pyproject.toml', 'poetry.lock', 'entrypoint.sh') }}" | cut -c1-12)
          echo "build_hash=$BUILD_HASH" >> $GITHUB_OUTPUT
          echo "BUILD_HASH=$BUILD_HASH" >> $GITHUB_ENV

          # Verificar se a imagem com esse hash existe
          if docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$BUILD_HASH > /dev/null 2>&1; then
            echo "✅ Imagem já existe com hash $BUILD_HASH"
            echo "needs_build=false" >> $GITHUB_OUTPUT
            echo "image_exists=true" >> $GITHUB_OUTPUT
          else
            echo "🔄 Imagem não existe, necessário build"
            echo "needs_build=true" >> $GITHUB_OUTPUT
            echo "image_exists=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build e Push Docker Image
    runs-on: ubuntu-latest
    needs: [check-image]
    if: needs.check-image.outputs.needs_build == 'true'
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache de camadas do Docker
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadata para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,suffix=,format=short
            type=raw,value=${{ env.BUILD_HASH }}

      - name: Build e push da imagem Docker
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          cache-from: |
            type=gha
            type=local,src=/tmp/.buildx-cache
          cache-to: |
            type=gha,mode=max
            type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Mover cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  deploy:
    name: Deploy para Azure Container Instances
    runs-on: ubuntu-latest
    needs: [check-image, build]
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    outputs:
      container_ip: ${{ steps.deploy.outputs.ip }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login na Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Criar Resource Group
        run: |
          az group create \
            --name ${{ env.AZURE_RESOURCE_GROUP }} \
            --location brazilsouth \
            --tags "project=tech-challenge" "environment=production" || true

      - name: Criar Azure AI Services
        run: |
          for service in tech-challenge-text tech-challenge-speech tech-challenge-vision tech-challenge-content-safety; do
            echo "Verificando serviço: $service"

            # Tentar verificar se o serviço já existe e está saudável
            if az cognitiveservices account show --name $service --resource-group ${{ env.AZURE_RESOURCE_GROUP }} >/dev/null 2>&1; then
              echo "✅ Serviço $service já existe e está saudável, reaproveitando..."
              continue
            fi

            echo "⚠️ Serviço $service não encontrado ou com erro, tentando purgar soft-deleted..."
            az cognitiveservices account purge \
              --name $service \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --location brazilsouth 2>/dev/null || true

            echo "🔄 Criando serviço: $service"
            KIND=$(if [ "$service" = "tech-challenge-text" ]; then echo "TextAnalytics"; elif [ "$service" = "tech-challenge-speech" ]; then echo "SpeechServices"; elif [ "$service" = "tech-challenge-content-safety" ]; then echo "ContentSafety"; else echo "ComputerVision"; fi)
            az resource create \
              --id "/subscriptions/$(az account show --query id -o tsv)/resourceGroups/${{ env.AZURE_RESOURCE_GROUP }}/providers/Microsoft.CognitiveServices/accounts/$service" \
              --properties "{ \"kind\": \"$KIND\", \"sku\": { \"name\": \"F0\" }, \"location\": \"brazilsouth\", \"properties\": { \"publicNetworkAccess\": \"Enabled\" } }" \
              --is-full-object
          done

      - name: Obter credenciais
        id: credentials
        run: |
          echo "text_endpoint=$(az cognitiveservices account show --name tech-challenge-text --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.endpoint -o tsv)" >> $GITHUB_OUTPUT
          echo "text_key=$(az cognitiveservices account keys list --name tech-challenge-text --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query key1 -o tsv)" >> $GITHUB_OUTPUT
          echo "speech_key=$(az cognitiveservices account keys list --name tech-challenge-speech --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query key1 -o tsv)" >> $GITHUB_OUTPUT
          echo "vision_endpoint=$(az cognitiveservices account show --name tech-challenge-vision --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.endpoint -o tsv)" >> $GITHUB_OUTPUT
          echo "vision_key=$(az cognitiveservices account keys list --name tech-challenge-vision --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query key1 -o tsv)" >> $GITHUB_OUTPUT
          echo "content_safety_endpoint=$(az cognitiveservices account show --name tech-challenge-content-safety --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.endpoint -o tsv)" >> $GITHUB_OUTPUT
          echo "content_safety_key=$(az cognitiveservices account keys list --name tech-challenge-content-safety --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query key1 -o tsv)" >> $GITHUB_OUTPUT

      - name: Determinar tag da imagem
        id: image-tag
        run: |
          if [ "${{ needs.build.result }}" == "skipped" ]; then
            # Se o build foi skipped, usar o hash dos arquivos
            BUILD_HASH=$(echo "${{ hashFiles('Dockerfile', 'pyproject.toml', 'poetry.lock', 'entrypoint.sh') }}" | cut -c1-12)
            echo "tag=$BUILD_HASH" >> $GITHUB_OUTPUT
            echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$BUILD_HASH" >> $GITHUB_OUTPUT
            echo "✅ Usando imagem existente com hash: $BUILD_HASH"
          else
            # Se o build foi executado, usar o SHA do commit
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "tag=$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "✅ Usando imagem nova com SHA: $SHORT_SHA"
          fi

      - name: Deploy Container Instance
        id: deploy
        run: |
          # Garantir que não há container anterior
          echo "🗑️  Deletando container existente..."
          az container delete --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name tech-challenge-api --yes 2>/dev/null || true

          # Aguardar para garantir deleção
          sleep 10

          IMAGE="${{ steps.image-tag.outputs.image }}"
          echo "🚀 Criando container com imagem: $IMAGE"

          # Criar novo container com tag específica (não usa cache)
          az container create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name tech-challenge-api \
            --image "$IMAGE" \
            --cpu 1 --memory 2 --ports 8000 --ip-address public --os-type Linux --location brazilsouth \
            --environment-variables \
              ENVIRONMENT=production \
              LOG_LEVEL=INFO \
              AZURE_TEXT_ENDPOINT="${{ steps.credentials.outputs.text_endpoint }}" \
              AZURE_TEXT_KEY="${{ steps.credentials.outputs.text_key }}" \
              AZURE_SPEECH_KEY="${{ steps.credentials.outputs.speech_key }}" \
              AZURE_SPEECH_REGION=brazilsouth \
              AZURE_VISION_ENDPOINT="${{ steps.credentials.outputs.vision_endpoint }}" \
              AZURE_VISION_KEY="${{ steps.credentials.outputs.vision_key }}" \
              AZURE_CONTENT_SAFETY_ENDPOINT="${{ steps.credentials.outputs.content_safety_endpoint }}" \
              AZURE_CONTENT_SAFETY_KEY="${{ steps.credentials.outputs.content_safety_key }}" \
              CONTENT_SAFETY_ENABLED=true \
              DATABASE_URL="sqlite:///tmp/app.db" \
              REDIS_ENABLED=false \
              SECURITY_API_KEY="${{ secrets.API_KEY }}" \
              SECURITY_ADMIN_KEY="${{ secrets.ADMIN_KEY }}" \
              SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            --restart-policy OnFailure

          echo "✅ Container criado com sucesso!"

          # Salvar IP para o próximo step
          IP=$(az container show --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name tech-challenge-api --query ipAddress.ip -o tsv)
          echo "ip=$IP" >> $GITHUB_OUTPUT

      - name: Aguardar inicialização
        run: sleep 60

      - name: Health Check
        id: health
        run: |
          IP="${{ steps.deploy.outputs.ip }}"
          echo "🔄 Aguardando health check em: http://$IP:8000/health"

          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://$IP:8000/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passou!"
              echo "🌐 API disponível em: http://$IP:8000"
              exit 0
            fi
            echo "⏳ Tentativa $i/15 - Status: $STATUS"
            sleep 20
          done
          echo "❌ Health check falhou"
          exit 1

          # Lista de arquivos que podem conter o placeholder
          FILES=(
            "README.md"
            "specs/009-deploy-azure/tasks.md"
            "specs/009-deploy-azure/quickstart.md"
            "specs/009-deploy-azure/spec.md"
            "docs/PROJECT_STATUS.md"
            "docs/RUNNING.md"
            "docs/technical/compliance-analysis.md"
          )

          CHANGES_MADE=false

          for file in "${FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "⚠️ Arquivo não encontrado: $file"
              continue
            fi

            echo "🔍 Verificando: $file"

            # Verificar se há placeholder para substituir
            if grep -q "<DEPLOY_URL>" "$file" 2>/dev/null; then
              echo "  🔄 Substituindo <DEPLOY_URL> em $file"
              sed -i "s|<DEPLOY_URL>|$NEW_URL|g" "$file"
              CHANGES_MADE=true
            # Verificar se já existe um IP anterior
            elif grep -qE "http://[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+:8000" "$file" 2>/dev/null; then
              echo "  🔄 Atualizando IP anterior em $file"
              sed -i "s|http://[0-9]\+\.[0-9]\+\.[0-9]\+\.[0-9]\+:8000|$NEW_URL|g" "$file"
              CHANGES_MADE=true
            else
              echo "  ℹ️ Nenhuma alteração necessária em $file"
            fi
          done

          # Verificar se houve alterações
          if [ "$CHANGES_MADE" = false ] || git diff --quiet 2>/dev/null; then
            echo "ℹ️ Nenhuma alteração para commitar"
            exit 0
          fi

          # Configurar git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Criar branch para o update
          BRANCH_NAME="docs/update-deploy-ip-$(date +%s)"
          git checkout -b "$BRANCH_NAME"

          # Commit das alterações
          git add "${FILES[@]}" 2>/dev/null || echo "⚠️ Alguns arquivos não puderam ser adicionados"
          git commit -m "docs: atualiza IP de produção na documentação" \
             -m "IP: $NEW_URL" \
             -m "Arquivos atualizados: README.md, specs/, docs/" \
             -m "Deploy automático via GitHub Actions"

          # Push para a branch
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          if ! git push origin "$BRANCH_NAME" 2>&1; then
            echo "⚠️ Falha ao criar branch para PR"
            exit 0
          fi

          # Criar PR usando GitHub API
          echo "🔄 Criando Pull Request..."
          PR_RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls" \
            -d "{
              \"title\": \"docs: atualiza IP de produção - $NEW_URL\",
              \"body\": \"## 📝 Atualização Automática de Documentação\\n\\n**IP do Deploy:** $NEW_URL\\n\\n**Data:** $(date -u +%Y-%m-%d)\\n\\n**Arquivos Atualizados:**\\n- README.md\\n- specs/009-deploy-azure/\\n- docs/PROJECT_STATUS.md\\n- docs/RUNNING.md\\n- docs/technical/compliance-analysis.md\\n\\n---\\n*Deploy automático via GitHub Actions*\",
              \"head\": \"$BRANCH_NAME\",
              \"base\": \"main\"
            }" 2>&1)

          PR_NUMBER=$(echo "$PR_RESPONSE" | grep -o '"number": [0-9]*' | head -1 | cut -d' ' -f2)

          if [ -n "$PR_NUMBER" ]; then
            echo "✅ Pull Request criada: #$PR_NUMBER"
            echo "🔗 https://github.com/${{ github.repository }}/pull/$PR_NUMBER"

            # Tentar fazer merge automatico
            echo "🔄 Tentando merge automático..."
            MERGE_RESPONSE=$(curl -s -X PUT \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER/merge" \
              -d "{
                \"commit_title\": \"docs: atualiza IP de produção na documentação [skip ci]\",
                \"commit_message\": \"IP: $NEW_URL\\nArquivos atualizados: README.md, specs/, docs/\\nDeploy automático via GitHub Actions\",
                \"merge_method\": \"squash\"
              }" 2>&1)

            if echo "$MERGE_RESPONSE" | grep -q '"merged": true'; then
              echo "✅ PR mergeada automaticamente!"
            else
              echo "ℹ️ PR criada mas requer merge manual (pode necessitar de review)"
              echo "🔗 https://github.com/${{ github.repository }}/pull/$PR_NUMBER"
            fi
          else
            echo "⚠️ Falha ao criar PR"
            echo "Resposta: $PR_RESPONSE"
          fi

          # Sempre sai com sucesso para não falhar o deploy
          exit 0

      - name: Resumo do Deploy
        if: always()
        run: |
          echo "======================================"
          echo "📋 RESUMO DO DEPLOY"
          echo "======================================"
          echo "🌐 API URL: http://${{ steps.deploy.outputs.ip }}:8000"
          echo "🔗 Health Check: http://${{ steps.deploy.outputs.ip }}:8000/health"
          echo "======================================"
