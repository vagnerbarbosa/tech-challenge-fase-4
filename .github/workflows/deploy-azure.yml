name: Deploy Azure

on:
  push:
    branches: [main, master]
    # Executar apenas quando houver mudanças relevantes
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'entrypoint.sh'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:  # Permite execução manual

permissions:
  contents: read
  packages: write  # Necessário para push no ghcr.io

env:
  AZURE_RESOURCE_GROUP: rg-tech-challenge-fase4
  REGISTRY: ghcr.io
  IMAGE_NAME: vagnerbarbosa/tech-challenge-fase4

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Executar Testes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Carregar dependências em cache
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}-v2

      - name: Instalar dependências
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Instalar projeto
        run: poetry install --no-interaction

      - name: Executar linters (Ruff)
        run: poetry run ruff check src/ tests/ || true

      - name: Executar type checker (mypy)
        run: poetry run mypy src/ || true

      - name: Executar testes
        run: poetry run pytest tests/ -v --cov=src --cov-report=xml --cov-fail-under=70
        env:
          PYTHONPATH: ${{ github.workspace }}
          AZURE_TEXT_KEY: fake-key-for-testing
          AZURE_TEXT_ENDPOINT: http://localhost:3001/

  build:
    name: Build e Push Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadata para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      - name: Build e push da imagem Docker
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    name: Deploy para Azure Container Instances
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    outputs:
      container_ip: ${{ steps.deploy.outputs.container_ip }}

    steps:
      - name: Login na Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Criar Resource Group (se não existir)
        run: |
          az group create \
            --name ${{ env.AZURE_RESOURCE_GROUP }} \
            --location brazilsouth \
            --tags "project=tech-challenge" "environment=production" || true

      - name: Criar Azure AI Services
        run: |
          # Text Analytics
          az cognitiveservices account create \
            --name tech-challenge-text \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --location brazilsouth \
            --kind TextAnalytics \
            --sku F0 || true

          # Speech Service
          az cognitiveservices account create \
            --name tech-challenge-speech \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --location brazilsouth \
            --kind SpeechServices \
            --sku F0 || true

          # Vision Service
          az cognitiveservices account create \
            --name tech-challenge-vision \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --location brazilsouth \
            --kind ComputerVision \
            --sku F0 || true

      - name: Obter credenciais dos serviços
        id: credentials
        run: |
          TEXT_ENDPOINT=$(az cognitiveservices account show --name tech-challenge-text --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.endpoint -o tsv)
          TEXT_KEY=$(az cognitiveservices account keys list --name tech-challenge-text --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query key1 -o tsv)
          SPEECH_KEY=$(az cognitiveservices account keys list --name tech-challenge-speech --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query key1 -o tsv)
          VISION_ENDPOINT=$(az cognitiveservices account show --name tech-challenge-vision --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.endpoint -o tsv)
          VISION_KEY=$(az cognitiveservices account keys list --name tech-challenge-vision --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query key1 -o tsv)

          echo "text_endpoint=$TEXT_ENDPOINT" >> $GITHUB_OUTPUT
          echo "text_key=$TEXT_KEY" >> $GITHUB_OUTPUT
          echo "speech_key=$SPEECH_KEY" >> $GITHUB_OUTPUT
          echo "vision_endpoint=$VISION_ENDPOINT" >> $GITHUB_OUTPUT
          echo "vision_key=$VISION_KEY" >> $GITHUB_OUTPUT

      - name: Deploy Container Instance
        id: deploy
        run: |
          IMAGE_URL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "🚀 Deploying image: $IMAGE_URL"

          # Deletar container existente se houver
          az container delete \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name tech-challenge-api \
            --yes 2>/dev/null || true

          # Criar novo container
          az container create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name tech-challenge-api \
            --image $IMAGE_URL \
            --cpu 1 \
            --memory 2 \
            --ports 8000 \
            --ip-address public \
            --os-type Linux \
            --location brazilsouth \
            --environment-variables \
              ENVIRONMENT=production \
              LOG_LEVEL=INFO \
              AZURE_TEXT_ENDPOINT="${{ steps.credentials.outputs.text_endpoint }}" \
              AZURE_TEXT_KEY="${{ steps.credentials.outputs.text_key }}" \
              AZURE_SPEECH_KEY="${{ steps.credentials.outputs.speech_key }}" \
              AZURE_SPEECH_REGION=brazilsouth \
              AZURE_VISION_ENDPOINT="${{ steps.credentials.outputs.vision_endpoint }}" \
              AZURE_VISION_KEY="${{ steps.credentials.outputs.vision_key }}" \
              DATABASE_URL=sqlite:///tmp/app.db \
              REDIS_ENABLED=false \
              SECURITY_API_KEY="${{ secrets.API_KEY }}" \
              SECURITY_ADMIN_KEY="${{ secrets.ADMIN_KEY }}" \
            --restart-policy OnFailure

          # Obter IP do container
          CONTAINER_IP=$(az container show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name tech-challenge-api \
            --query ipAddress.ip \
            --output tsv)

          echo "container_ip=$CONTAINER_IP" >> $GITHUB_OUTPUT
          echo "✅ Container deployed at: $CONTAINER_IP:8000"

      - name: Aguardar inicialização
        run: sleep 60

  health-check:
    name: Health Check e Validação
    runs-on: ubuntu-latest
    needs: [deploy]

    steps:
      - name: Login na Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Obter IP do Container
        id: get_ip
        run: |
          CONTAINER_IP=$(az container show \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name tech-challenge-api \
            --query ipAddress.ip \
            --output tsv)
          echo "container_ip=$CONTAINER_IP" >> $GITHUB_OUTPUT
          echo "🌐 Container IP: $CONTAINER_IP"

      - name: Health Check
        id: health
        run: |
          echo "⏳ Aguardando aplicação iniciar..."
          MAX_RETRIES=15
          RETRY_COUNT=0
          APP_URL="http://${{ steps.get_ip.outputs.container_ip }}:8000/health"

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL" || echo "000")
            if [ "$RESPONSE" = "200" ]; then
              echo "✅ Health check passou!"
              exit 0
            fi
            echo "⏳ Tentativa $((RETRY_COUNT + 1))/$MAX_RETRIES - Status: $RESPONSE"
            RETRY_COUNT=$((RETRY_COUNT + 1))
            sleep 20
          done

          echo "❌ Health check falhou após $MAX_RETRIES tentativas"
          exit 1

      - name: Testar endpoints principais
        run: |
          BASE_URL="http://${{ steps.get_ip.outputs.container_ip }}:8000"
          echo "🧪 Testando endpoints em: $BASE_URL"

          # Testar health endpoint
          curl -sSf "$BASE_URL/health" > /dev/null && echo "✅ /health OK" || echo "⚠️ /health não responde"

          # Testar docs endpoint
          curl -sSf "$BASE_URL/docs" > /dev/null && echo "✅ /docs OK" || echo "⚠️ /docs não responde"

          echo ""
          echo "🎉 Deploy validado!"
          echo "🌐 API URL: $BASE_URL"
          echo "📚 Docs: $BASE_URL/docs"

  rollback:
    name: Notificar Falha
    runs-on: ubuntu-latest
    needs: [health-check]
    if: failure()

    steps:
      - name: Login na Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Obter logs do container
        run: |
          echo "📋 Logs do container:"
          az container logs \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name tech-challenge-api \
            --lines 50 || echo "Não foi possível obter logs"

      - name: Notificar falha
        run: |
          echo "❌ Deploy falhou"
          echo "Por favor, verifique os logs acima e no Azure Portal"
