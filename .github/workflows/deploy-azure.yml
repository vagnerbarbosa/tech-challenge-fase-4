name: Deploy Azure

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  AZURE_RESOURCE_GROUP: rg-tech-challenge-fase4
  REGISTRY: ghcr.io
  IMAGE_NAME: vagnerbarbosa/tech-challenge-fase4

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadata para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build e push da imagem Docker
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy para Azure Container Instances
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Login na Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Criar Resource Group
        run: |
          az group create \
            --name ${{ env.AZURE_RESOURCE_GROUP }} \
            --location brazilsouth \
            --tags "project=tech-challenge" "environment=production" || true

      - name: Criar Azure AI Services
        run: |
          for service in tech-challenge-text tech-challenge-speech tech-challenge-vision; do
            az cognitiveservices account create \
              --name $service \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --location brazilsouth \
              --kind $(if [ "$service" = "tech-challenge-text" ]; then echo "TextAnalytics"; elif [ "$service" = "tech-challenge-speech" ]; then echo "SpeechServices"; else echo "ComputerVision"; fi) \
              --sku F0 || true
          done

      - name: Obter credenciais
        id: credentials
        run: |
          echo "text_endpoint=$(az cognitiveservices account show --name tech-challenge-text --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.endpoint -o tsv)" >> $GITHUB_OUTPUT
          echo "text_key=$(az cognitiveservices account keys list --name tech-challenge-text --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query key1 -o tsv)" >> $GITHUB_OUTPUT
          echo "speech_key=$(az cognitiveservices account keys list --name tech-challenge-speech --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query key1 -o tsv)" >> $GITHUB_OUTPUT
          echo "vision_endpoint=$(az cognitiveservices account show --name tech-challenge-vision --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.endpoint -o tsv)" >> $GITHUB_OUTPUT
          echo "vision_key=$(az cognitiveservices account keys list --name tech-challenge-vision --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query key1 -o tsv)" >> $GITHUB_OUTPUT

      - name: Deploy Container Instance
        run: |
          az container delete --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name tech-challenge-api --yes 2>/dev/null || true

          az container create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name tech-challenge-api \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --cpu 1 --memory 2 --ports 8000 --ip-address public --os-type Linux --location brazilsouth \
            --environment-variables \
              ENVIRONMENT=production \
              LOG_LEVEL=INFO \
              AZURE_TEXT_ENDPOINT="${{ steps.credentials.outputs.text_endpoint }}" \
              AZURE_TEXT_KEY="${{ steps.credentials.outputs.text_key }}" \
              AZURE_SPEECH_KEY="${{ steps.credentials.outputs.speech_key }}" \
              AZURE_SPEECH_REGION=brazilsouth \
              AZURE_VISION_ENDPOINT="${{ steps.credentials.outputs.vision_endpoint }}" \
              AZURE_VISION_KEY="${{ steps.credentials.outputs.vision_key }}" \
              DATABASE_URL="sqlite:///tmp/app.db" \
              REDIS_ENABLED=false \
              SECURITY_API_KEY="${{ secrets.API_KEY }}" \
              SECURITY_ADMIN_KEY="${{ secrets.ADMIN_KEY }}" \
            --restart-policy OnFailure

      - name: Aguardar inicialização
        run: sleep 60

      - name: Health Check
        run: |
          IP=$(az container show --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name tech-challenge-api --query ipAddress.ip -o tsv)
          for i in {1..15}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://$IP:8000/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passou!"
              echo "🌐 API disponível em: http://$IP:8000"
              exit 0
            fi
            echo "⏳ Tentativa $i/15 - Status: $STATUS"
            sleep 20
          done
          echo "❌ Health check falhou"
          exit 1
