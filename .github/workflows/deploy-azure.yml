name: Deploy Azure

on:
  push:
    branches: [main, master]
    # Executar apenas quando houver mudanças relevantes
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:  # Permite execução manual

permissions:
  contents: read
  packages: write  # Necessário para push no ghcr.io

env:
  AZURE_WEBAPP_NAME: tech-challenge-api-grupo-27
  AZURE_RESOURCE_GROUP: rg-tech-challenge-fase4
  REGISTRY: ghcr.io
  IMAGE_NAME: vagnerbarbosa/tech-challenge-fase4

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e Push Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadata para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}

      - name: Build e push da imagem Docker
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    name: Deploy para Azure
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Login na Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configurar imagem no App Service
        run: |
          IMAGE_URL="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image_digest }}"
          echo "🚀 Deploying image: $IMAGE_URL"
          az webapp config container set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --container-image-name $IMAGE_URL \
            --container-registry-url https://${{ env.REGISTRY }}

      - name: Configurar startup command
        run: |
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --startup-file "uvicorn src.api.main:app --host 0.0.0.0 --port 8000"

      - name: Restart App Service
        run: |
          az webapp restart \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }}

      - name: Aguardar deploy (30s)
        run: sleep 30

  health-check:
    name: Health Check e Validação
    runs-on: ubuntu-latest
    needs: [deploy]

    steps:
      - name: Health Check
        id: health
        run: |
          echo "⏳ Aguardando aplicação iniciar..."
          MAX_RETRIES=10
          RETRY_COUNT=0
          APP_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL" || echo "000")
            if [ "$RESPONSE" = "200" ]; then
              echo "✅ Health check passou!"
              exit 0
            fi
            echo "⏳ Tentativa $((RETRY_COUNT + 1))/$MAX_RETRIES - Status: $RESPONSE"
            RETRY_COUNT=$((RETRY_COUNT + 1))
            sleep 15
          done

          echo "❌ Health check falhou após $MAX_RETRIES tentativas"
          exit 1

      - name: Testar endpoints principais
        run: |
          BASE_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "🧪 Testando endpoints..."

          # Testar health endpoint
          curl -sSf "$BASE_URL/health" > /dev/null && echo "✅ /health OK" || echo "⚠️ /health não responde"

          # Testar docs endpoint
          curl -sSf "$BASE_URL/docs" > /dev/null && echo "✅ /docs OK" || echo "⚠️ /docs não responde"

          echo "🎉 Deploy validado!"

  rollback:
    name: Rollback (se necessário)
    runs-on: ubuntu-latest
    needs: [health-check]
    if: failure()

    steps:
      - name: Login na Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Rollback para versão anterior
        run: |
          echo "🔄 Iniciando rollback..."

          # Obter imagem anterior
          PREVIOUS_IMAGE=$(az webapp config container show \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query '[0].image' -o tsv 2>/dev/null || echo "")

          if [ -n "$PREVIOUS_IMAGE" ]; then
            echo "🔄 Revertendo para: $PREVIOUS_IMAGE"
            az webapp config container set \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --container-image-name $PREVIOUS_IMAGE
          else
            echo "⚠️ Não foi possível obter imagem anterior"
          fi

      - name: Notificar falha
        if: failure()
        run: |
          echo "❌ Deploy falhou e rollback não foi possível"
          echo "Por favor, verifique manualmente no Azure Portal"
