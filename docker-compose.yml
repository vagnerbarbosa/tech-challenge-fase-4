# ===========================================
# Docker Compose para Desenvolvimento
# ===========================================

version: "3.8"

services:
  # -------------------------------------------
  # API FastAPI
  # -------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: health-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # App
      - APP_NAME=Multimodal Health Analysis API
      - APP_VERSION=0.3.0
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      # Azure (carregar do .env)
      - AZURE_TEXT_KEY=${AZURE_TEXT_KEY}
      - AZURE_TEXT_ENDPOINT=${AZURE_TEXT_ENDPOINT}
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION:-brazilsouth}
      - AZURE_VISION_KEY=${AZURE_VISION_KEY}
      - AZURE_VISION_ENDPOINT=${AZURE_VISION_ENDPOINT}
      # Database
      - DATABASE_URL=sqlite+aiosqlite:///./data/health_analysis.db
      # Redis
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=false
      # Rate Limiting
      - RATE_LIMIT_ENABLED=true
      - MAX_TEXT_REQUESTS_PER_DAY=${MAX_TEXT_REQUESTS_PER_DAY:-160}
      - MAX_SPEECH_MINUTES_PER_DAY=${MAX_SPEECH_MINUTES_PER_DAY:-10}
      - MAX_VISION_REQUESTS_PER_DAY=${MAX_VISION_REQUESTS_PER_DAY:-160}
      # Security
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - API_KEY=${API_KEY}
      # LGPD
      - ANONYMIZE_PII=true
      - CONSENT_REQUIRED=true
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - health-network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # -------------------------------------------
  # Redis (Opcional - para cache/rate limiting)
  # -------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: health-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - health-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # -------------------------------------------
  # Test Runner (para executar testes)
  # -------------------------------------------
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: health-api-test
    environment:
      - ENVIRONMENT=testing
      - LOG_LEVEL=DEBUG
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY:-}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION:-brazilsouth}
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
    command: poetry run pytest tests/unit/services/test_audio_analysis.py -v --cov=src --cov-report=term
    profiles:
      - test

volumes:
  redis-data:

networks:
  health-network:
    driver: bridge
